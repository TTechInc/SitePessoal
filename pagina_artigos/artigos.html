<body>
    <a href="#main" class="skip-link">Saltar para o conteúdo</a>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="header header--collapsible">
        <div class="container nav-wrapper">
            <a href="../index.html" class="brand" aria-label="Pedro Oliveira — início">
                <span class="brand-name">Pedro Oliveira</span>
            </a>

            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="menu">
                <span></span><span></span><span></span>

            <nav class="nav-menu" id="menu" aria-label="Navegação principal">

                <a href="../index.html#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main id="main">
        <section id="filtros" class="section reveal">
            <div class="container">
                <div class="filters-wrapper">
                    <div class="articles-box">
                        <h1 class="page-title">Explorar artigos</h1>
                        <p>Artigos de Pedro Oliveira e colegas.</p>
                        <div class="filters-grid" role="search">
                            <input type="search" id="searchInput" placeholder="Pesquisar artigos..."
                                aria-label="Pesquisar artigos">

                            <select id="tagFilter" aria-label="Filtrar por tag">
                                <option value="">Todas as tags</option>
                                <option value="Académico">Académico</option>
                                <option value="Reflexões">Reflexões</option>
                                <option value="Técnico">Técnico</option>
                            </select>

                            <select id="authorFilter" aria-label="Filtrar por autor">
                                <option value="">Todos os autores</option>
                                <option value="Pedro Oliveira">Pedro Oliveira</option>
                                <option value="Outros">Outros</option>
                            </select>

                            <select id="sortFilter" aria-label="Ordenar artigos">
                                <option value="recent">Mais recente</option>
                                <option value="old">Mais antigo</option>
                                <option value="title">Título A-Z</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section reveal" style="padding-top:1.5rem">
            <div class="container">
                <div id="articlesList" class="articles-list" aria-live="polite"></div>
                <div class="load-more-wrap">
                    <button id="loadMoreBtn" class="btn-primary article-btn">Carregar mais</button>
                </div>
            </div>
        </section>
    </main>
